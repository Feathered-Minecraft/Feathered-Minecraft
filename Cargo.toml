[workspace]
resolver = "2"
members = [
    "assets",
    "engine/world",
    "engine/chunk",
    "engine/renderer",
    "client",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Feathered Minecraft Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Feathered-Minecraft/Feathered-Minecraft"

[workspace.dependencies]
feathered-assets = { path = "assets" }
feathered-world = { path = "engine/world" }
feathered-chunk = { path = "engine/chunk" }
feathered-renderer = { path = "engine/renderer" }
feathered-client = { path = "client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
sha2 = "0.10"
wgpu = "30"
winit = "=0.31.0-beta.3"
pollster = "0.4"

[profile.release]
lto = "thin"
